<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Comissoes — Melhor Credito</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--mc:#1E9FE8;--mc-d:#0D87CC;--mc-l:#EBF7FE;--mc-ll:#F5FBFF;--dark:#0D1B2A;--text:#1C2E3E;--lbl:#4E6578;--bdr:#C8E8F7;--bg:#F2F8FD;--white:#fff;--green:#10B981;--red:#EF4444;--amber:#F59E0B;--font:'Plus Jakarta Sans',sans-serif;--fh:'Sora',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--dark);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.htag{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mc);background:rgba(30,159,232,.12);padding:3px 9px;border-radius:20px;border:1px solid rgba(30,159,232,.2)}
#s-login{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{background:var(--white);border:1px solid var(--bdr);border-radius:20px;padding:36px 32px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(30,159,232,.1);text-align:center}
.lcard-logo{width:64px;height:64px;background:var(--white);border:1.5px solid var(--bdr);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;padding:8px}
.lcard-logo img{width:100%;height:100%;object-fit:contain}
.lcard h2{font-family:var(--fh);font-size:20px;color:var(--dark);margin-bottom:4px}
.lcard p{font-size:12px;color:var(--lbl);margin-bottom:22px}
.finp{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:10px;font-family:var(--font);font-size:14px;color:var(--text);background:var(--mc-ll);outline:none;margin-bottom:10px;transition:all .2s}
.finp:focus{border-color:var(--mc);background:#fff;box-shadow:0 0 0 3px rgba(30,159,232,.08)}
.lbtn{width:100%;padding:12px;background:linear-gradient(135deg,var(--mc),var(--mc-d));color:#fff;border:none;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(30,159,232,.3);transition:all .2s}
.lbtn:hover{transform:translateY(-1px)}
.lerr{font-size:12px;color:var(--red);margin-top:8px;display:none}
#s-main{display:none;flex-direction:column;padding:22px 20px;max-width:1100px;margin:0 auto;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.scard{background:var(--white);border:1px solid var(--bdr);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.scard .n{font-family:var(--fh);font-size:28px;font-weight:700}
.scard .l{font-size:11px;color:var(--lbl);margin-top:3px;font-weight:500}
.scard.pend .n{color:var(--amber)}.scard.anal .n{color:var(--mc)}.scard.res .n{color:var(--green)}.scard.tot .n{color:var(--dark)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fsel,.fsrch{padding:8px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-family:var(--font);font-size:12px;color:var(--text);background:var(--white);outline:none}
.fsel:focus,.fsrch:focus{border-color:var(--mc)}
.fsrch{flex:1;min-width:180px}
.fsrch::placeholder{color:#9eb8cc}
.btn-ref{padding:8px 14px;background:var(--mc-l);border:1px solid rgba(30,159,232,.2);border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--mc);cursor:pointer;transition:all .2s}
.btn-ref:hover{background:var(--mc);color:#fff}
.twrap{background:var(--white);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
thead th{padding:11px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--lbl);text-transform:uppercase;letter-spacing:.08em;border-bottom:1.5px solid var(--bdr);background:var(--mc-ll);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--mc-ll);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--mc-ll)}
tbody td{padding:11px 14px;font-size:12px;color:var(--text);vertical-align:middle}
.tname{font-weight:700;color:var(--dark)}.tsub{font-size:10px;color:var(--lbl);margin-top:1px}
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.pendente{background:#FFF7ED;color:#B45309;border:1px solid #FDE68A}
.badge.analise{background:var(--mc-l);color:var(--mc-d);border:1px solid rgba(30,159,232,.2)}
.badge.resolvido{background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.abtn{padding:5px 9px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.abtn.anal{background:var(--mc-l);color:var(--mc-d)}.abtn.anal:hover{background:var(--mc);color:#fff}
.abtn.res{background:#F0FDF4;color:#16A34A}.abtn.res:hover{background:var(--green);color:#fff}
.abtn.wa{background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0}.abtn.wa:hover{background:#16A34A;color:#fff}
.abtn.del{background:#FEF2F2;color:var(--red)}.abtn.del:hover{background:var(--red);color:#fff}
.lov{position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.lov.open{display:flex}
.modal{background:var(--white);border-radius:20px;padding:26px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal h3{font-family:var(--fh);font-size:17px;color:var(--dark);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--mc-l)}
.drow{display:flex;margin-bottom:9px;font-size:13px;gap:8px}
.dk{font-weight:700;color:var(--lbl);min-width:130px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.dv{color:var(--text);flex:1;font-weight:500}
.mbtns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.mbtn{flex:1;padding:10px;border:none;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;min-width:100px}
.mbtn.wa{background:#25D366;color:#fff;box-shadow:0 3px 10px rgba(37,211,102,.3)}.mbtn.wa:hover{background:#128C7E}
.mbtn.cancel{background:var(--bg);color:var(--lbl);border:1px solid var(--bdr)}.mbtn.cancel:hover{border-color:var(--mc);color:var(--mc)}
.wa-prev{background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:12px;font-size:11px;color:var(--text);line-height:1.8;margin-top:12px;white-space:pre-wrap;font-family:monospace;max-height:200px;overflow-y:auto}
.empty{text-align:center;padding:48px;color:var(--lbl)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;border-left:3px solid var(--mc)}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{background:#064E3B;border-color:var(--green)}
.toast.err{background:#7F1D1D;border-color:var(--red)}
</style>
</head>

  });
});

function doLogin() {
  if(document.getElementById('l-senha').value === SENHA) {
    document.getElementById('s-login').style.display = 'none';
    document.getElementById('s-main').style.display = 'flex';
    carregarDados();
  } else {
    document.getElementById('lerr').style.display = 'block';
  }
}



async function ghGet() {
  var r = await fetch(GH_RAW + 'data/comissoes.json?t=' + Date.now());
  if(!r.ok) throw new Error('Erro ' + r.status);
  return await r.json();
}

async function ghSet(data) {
  var r = await fetch(GH_BASE + 'data/comissoes.json', {
    headers: {'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json'}
  });
  var info = await r.json();
  var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  var r2 = await fetch(GH_BASE + 'data/comissoes.json', {
    method: 'PUT',
    headers: {'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json'},
    body: JSON.stringify({message: 'update', content: encoded, sha: info.sha})
  });
  if(!r2.ok) throw new Error('Erro ao salvar');
}

async function carregarDados() {
  try {
    DADOS = await ghGet();
    renderTabela();
    toast('Atualizado!', 'ok');
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}



function renderTabela() {
  var srch = document.getElementById('fsrch').value.toLowerCase();
  var fst  = document.getElementById('fstatus').value;
  document.getElementById('st-pend').textContent = DADOS.filter(function(d){ return d.status==='pendente'; }).length;
  document.getElementById('st-anal').textContent = DADOS.filter(function(d){ return d.status==='analise'; }).length;
  document.getElementById('st-res').textContent  = DADOS.filter(function(d){ return d.status==='resolvido'; }).length;
  document.getElementById('st-tot').textContent  = DADOS.length;
  var filtered = DADOS.filter(function(d) {
    if(fst && d.status !== fst) return false;
    if(srch && !d.parceiro.toLowerCase().includes(srch) && !(d.cpf||'').includes(srch) && !(d.banco||'').toLowerCase().includes(srch) && !(d.proposta||'').includes(srch)) return false;
    return true;
  });
  var tbody = document.getElementById('tbody');
  if(!filtered.length) { tbody.innerHTML = '<tr><td colspan="7"><div class="empty">Nenhuma solicitacao encontrada</div></td></tr>'; return; }
  tbody.innerHTML = '';
  filtered.forEach(function(d) {
    var dt = d.createdAt ? new Date(d.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    var badge = d.status==='pendente' ? '<span class="badge pendente">Pendente</span>' : d.status==='analise' ? '<span class="badge analise">Em analise</span>' : '<span class="badge resolvido">Resolvido</span>';
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><div class="tname">'+d.parceiro+'</div><div class="tsub">'+dt+'</div></td>'
      +'<td><div>'+d.cpf+'</div><div class="tsub">#'+d.proposta+'</div></td>'
      +'<td><div>'+d.banco+'</div><div class="tsub">'+d.produto+'</div></td>'
      +'<td><strong>'+d.valor+'</strong></td>'
      +'<td>'+(d.data||'—')+'</td>'
      +'<td>'+badge+'</td>'
      +'<td><div class="acts"></div></td>';
    var acts = tr.querySelector('.acts');
    if(d.status==='pendente'){var ba=document.createElement('button');ba.className='abtn anal';ba.textContent='Analisar';ba.onclick=(function(id){return function(){mudarStatus(id,'analise');};})(d.id);acts.appendChild(ba);}
    if(d.status!=='resolvido'){var br=document.createElement('button');br.className='abtn res';br.textContent='Resolver';br.onclick=(function(id){return function(){mudarStatus(id,'resolvido');};})(d.id);acts.appendChild(br);}
    var bw=document.createElement('button');bw.className='abtn wa';bw.textContent='WA';bw.onclick=(function(id){return function(){verDetalhe(id);};})(d.id);acts.appendChild(bw);
    var bd=document.createElement('button');bd.className='abtn del';bd.textContent='Excluir';bd.onclick=(function(id){return function(){excluir(id);};})(d.id);acts.appendChild(bd);
    tbody.appendChild(tr);
  });
}

async function mudarStatus(id, status) {
  var item = DADOS.find(function(d){ return d.id===id; });
  if(item) item.status = status;
  try { await ghSet(DADOS); renderTabela(); toast('Status atualizado!','ok'); } catch(e){ toast('Erro','err'); }
}

function verDetalhe(id) {
  itemAtual = DADOS.find(function(d){ return d.id===id; });
  if(!itemAtual) return;
  document.getElementById('modal-body').innerHTML = [
    ['Parceiro',itemAtual.parceiro],['CPF',itemAtual.cpf],['Proposta','#'+itemAtual.proposta],
    ['Banco',itemAtual.banco],['Produto',itemAtual.produto],['Valor',itemAtual.valor],
    ['Data Pgto',itemAtual.data||'—'],['Obs',itemAtual.obs||'—']
  ].map(function(r){ return '<div class="drow"><div class="dk">'+r[0]+'</div><div class="dv">'+r[1]+'</div></div>'; }).join('');
  var msg = montarMsg(itemAtual);
  document.getElementById('wa-prev').textContent = msg;
  document.getElementById('wa-prev').style.display = 'block';
  document.getElementById('modal-lov').classList.add('open');
}

function montarMsg(d) {
  return 'MELHOR CREDITO — COMISSAO ATRASADA

Parceiro: '+d.parceiro+'
CPF: '+d.cpf+'
Proposta: #'+d.proposta+'
Banco: '+d.banco+'
Produto: '+d.produto+'
Valor: '+d.valor+'
Data Pgto: '+(d.data||'—')+'
'+(d.obs?'Obs: '+d.obs+'
':'');
}



async function excluir(id) {
  if(!confirm('Excluir?')) return;
  DADOS = DADOS.filter(function(d){ return d.id!==id; });
  try { await ghSet(DADOS); renderTabela(); toast('Excluido!','ok'); } catch(e){ toast('Erro','err'); }
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+(type||'');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
</script>
